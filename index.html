<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Real Cali v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0f172a;color:#f1f5f9;padding:14px;max-width:440px;margin:0 auto}
h1{text-align:center;font-size:19px;font-weight:900;margin:8px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:10px;border-radius:99px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;font-size:12px;text-align:center;cursor:pointer}
.tab.active{background:#22c55e;color:#052e16;border-color:#22c55e}
.card{background:#1e293b;border-radius:20px;padding:16px;border:1px solid #334155;display:none}
.card.active{display:block}
label{font-size:10px;color:#94a3b8;text-transform:uppercase;font-weight:700;letter-spacing:1px;margin-top:10px;display:block}
label:first-child{margin-top:0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:15px;margin-top:5px;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{border-radius:18px;padding:16px;text-align:center;margin-top:12px}
.green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16}
.blue{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#082f49}
.big{font-size:32px;font-weight:900;letter-spacing:-1px}
.mid{font-size:13px;font-weight:700;margin-top:4px}
.small{font-size:11px;opacity:.85;margin-top:6px;line-height:1.4}
.det{margin-top:10px;background:#0f172a;border-radius:12px;padding:10px;font-size:11px;line-height:1.5;color:#cbd5e1;text-align:left}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;margin-top:6px}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef9c3;color:#854d0e}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:#334155;color:white;font-weight:800;margin-top:10px;cursor:pointer}
.btn-green{background:#22c55e;color:#052e16}
.sub{font-size:11px;color:#64748b;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<h1>🚗 CALCULADORA REAL CALI v2</h1>
<div class="tabs">
<div class="tab active" id="t1" onclick="setTab(1)">VIAJE ACTUAL</div>
<div class="tab" id="t2" onclick="setTab(2)">TARIFA / HORA</div>
</div>

<!-- MODO 1 -->
<div class="card active" id="c1">
<label>Costo por KM (gasolina/moto/carro)</label>
<input id="costo" type="number" value="600">
<label>Valor del viaje que te paga la app $</label>
<input id="valor" type="number" placeholder="Ej: 25612">
<div class="row">
<div><label>KM del viaje</label><input id="km" type="number" step="0.1" placeholder="11.7"></div>
<div><label>Minutos</label><input id="min" type="number" placeholder="44"></div>
</div>
<div id="out1" class="result green" style="display:none"></div>
<button class="btn btn-green" onclick="calc1()">Calcular ganancia real</button>
<p class="sub" style="margin-top:8px">Modo 1: Sabes el valor total del viaje</p>
</div>

<!-- MODO 2 -->
<div class="card" id="c2">
<label>Tu costo por KM ($)</label>
<input id="costo2" type="number" value="600">
<label>Tarifa que paga la app por KM ($)</label>
<input id="tarifaKm" type="number" placeholder="Ej: 1666 (25000/15km)">
<div class="row">
<div><label>KM del viaje</label><input id="km2" type="number" step="0.1" value="15"></div>
<div><label>Minutos</label><input id="min2" type="number" value="60"></div>
</div>
<label>Ganancia real esperada /h (opcional)</label>
<input id="esperada" type="number" placeholder="Ej: 25000">
<div id="out2" class="result blue" style="display:none"></div>
<button class="btn btn-green" onclick="calc2()">Calcular tarifa por hora</button>
<p class="sub" style="margin-top:8px">Modo 2: Sabes la tarifa por KM y quieres saber la ganancia por hora</p>
</div>

<script>
function setTab(n){
document.getElementById('c1').classList.toggle('active',n==1);
document.getElementById('c2').classList.toggle('active',n==2);
document.getElementById('t1').classList.toggle('active',n==1);
document.getElementById('t2').classList.toggle('active',n==2);
}
function calc1(){
let costo=parseFloat(costoEl('costo'))||0, valor=parseFloat(costoEl('valor'))||0, km=parseFloat(costoEl('km'))||0, min=parseFloat(costoEl('min'))||0;
if(!valor||!km||!min)return alert('Llena valor, km y minutos');
let gasto=km*costo, gan=valor-gasto, h=min/60, ph=gan/h;
show1(ph,gan,gasto,valor,km,h);
}
function costoEl(id){return document.getElementById(id).value}
function show1(ph,gan,gasto,valor,km,h){
let o=document.getElementById('out1'); o.style.display='block';
let cls=ph>=25000?'ok':ph>=15000?'warn':'bad';
let txt=ph>=25000?'🔥 BUEN VIAJE - ACEPTA':ph>=15000?'⚠️ VIAJE MEDIO':'❌ NO RENTABLE';
let badge=ph>=25000?'RENTABLE':ph>=15000?'MEDIO':'PERDIDA';
o.innerHTML=`<div class=big>$${Math.round(ph).toLocaleString('es-CO')} /h</div><div class=mid>${txt}</div><span class=badge ${cls}>${badge}</span><div class=small>Ganancia neta: $${Math.round(gan).toLocaleString()} (gasto $${Math.round(gasto).toLocaleString()})</div><div class=det>Valor app: $${valor.toLocaleString()}<br>Gasto (${km}km x $${document.getElementById('costo').value}): $${Math.round(gasto).toLocaleString()}<br>Tiempo: ${h.toFixed(2)}h<br><br><b>Formula:</b> (${valor} - ${Math.round(gasto)}) / ${h.toFixed(2)}h = $${Math.round(ph).toLocaleString()}/h</div>`;
}
function calc2(){
let costo=parseFloat(costoEl('costo2'))||0, tarifa=parseFloat(costoEl('tarifaKm'))||0, km=parseFloat(costoEl('km2'))||0, min=parseFloat(costoEl('min2'))||0, esp=parseFloat(costoEl('esperada'))||0;
if(!tarifa||!km||!min)return alert('Llena tarifa por KM, km y minutos');
let h=min/60, vel=km/h, brutoHora=tarifa*vel, netoHora=(tarifa-costo)*vel, valorViaje=tarifa*km, gasto=costo*km, gan=valorViaje-gasto;
let o=document.getElementById('out2'); o.style.display='block';
let cumple=esp? (netoHora>=esp?`✅ SUPERAS tu meta de $${esp.toLocaleString()}/h por $${Math.round(netoHora-esp).toLocaleString()}`:`❌ TE FALTA $${Math.round(esp-netoHora).toLocaleString()} para tu meta de $${esp.toLocaleString()}/h`) : `Velocidad promedio: ${vel.toFixed(1)} km/h`;
let minTarifa=esp? ((esp/vel)+costo) : 0;
o.innerHTML=`<div class=big>$${Math.round(netoHora).toLocaleString()} /h</div><div class=mid>Ganancia REAL neta por hora</div><div class=small>${cumple}</div><div class=det>Tarifa por KM: $${tarifa.toLocaleString()}<br>Costo por KM: $${costo.toLocaleString()}<br>Ganancia por KM: $${(tarifa-costo).toLocaleString()}<br>Velocidad: ${vel.toFixed(1)} km/h (${km}km en ${min}min)<br><br>💰 Bruta/h (sin descontar): $${Math.round(brutoHora).toLocaleString()}/h<br>✅ Neta/h (real): $${Math.round(netoHora).toLocaleString()}/h<br>Valor viaje: $${Math.round(valorViaje).toLocaleString()} - Gasto $${Math.round(gasto).toLocaleString()} = $${Math.round(gan).toLocaleString()}<br><br><b>Formula:</b> (${tarifa} - ${costo}) x ${vel.toFixed(2)}km/h = $${Math.round(netoHora).toLocaleString()}/h<br>${esp?`<br>Para ganar $${esp.toLocaleString()}/h necesitas tarifa mínima de <b>$${Math.round(minTarifa).toLocaleString()}/km</b>` : ''}</div>`;
}
</script>
</body>
</html>
